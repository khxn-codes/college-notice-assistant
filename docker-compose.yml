version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noticeiq-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - HF_HOME=/cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/cache/huggingface
      - TORCH_HOME=/cache/torch
    volumes:
      # Persist notices, SQLite DB, and Chroma vector index
      - ./data:/app/data
      # Cache HuggingFace / sentence-transformers model files across restarts
      - hf-cache:/cache/huggingface
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noticeiq-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - DATA_DIR=/app/data
      - HF_HOME=/cache/huggingface
    volumes:
      # Mount data directory so UI can view notice inbox if needed
      - ./data:/app/data
      - hf-cache:/cache/huggingface
    depends_on:
      backend:
        condition: service_healthy
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    restart: unless-stopped

volumes:
  hf-cache:
    name: noticeiq-hf-cache
